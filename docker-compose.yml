services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: army_bot
      POSTGRES_USER: army_bot
      POSTGRES_PASSWORD: army_bot
    ports:
      - "5438:5432"
    volumes:
      - army_bot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U army_bot -d army_bot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  army_bot_postgres:
