[project]
name = "army-deploy-bot"
version = "0.1.0"
description = "Telegram AI DevOps bot with multi-user credentials and clean architecture."
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.31.0",
    "aiosqlite==0.22.1",
    "asyncpg==0.31.0",
    "asyncssh==2.24.0",
    "cryptography==50.0.1",
    "google-genai==2.24.0",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.54",
    "structlog==26.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/armybot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
